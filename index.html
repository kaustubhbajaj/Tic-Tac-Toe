<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fun interactive Tic Tac Toe game">
    <title>TIC TAC TOE - Play Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li>MyTicTacToe.com</li>
        </ul>
    </nav>

    <div class="gameContainer">
        <div class="container" role="grid" aria-label="Tic Tac Toe Game Board">
            <div class="box" role="button" aria-label="Box 1"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 2"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 3"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 4"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 5"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 6"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 7"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 8"><span class="boxtext"></span></div>
            <div class="box" role="button" aria-label="Box 9"><span class="boxtext"></span></div>
        </div>

        <div class="gameinfo">
            <h1>Welcome to MyTicTacToe</h1>
            <div>
                <span class="info" aria-live="polite" role="status">Turn for X</span>
                <button id="reset" aria-label="Reset the game">Reset</button>
            </div>
            <div class="imgbox">
                <img src="excited.gif" alt="Victory celebration animation">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
